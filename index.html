<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La Vida da Vuelta Shop</title>
  <meta name="description" content="La vida da vuelta – T-Shirt Shop. Einfach bestellen, weltweit versendet." />

  <style>
    :root{
      --bg1:#86a6b8; --bg2:#b9c9d3; --bg3:#e6e6e6;
      --card: rgba(255,255,255,.90);
      --line: rgba(0,0,0,.10);
      --text:#151515; --muted:#4a4a4a;
      --shadow: 0 14px 40px rgba(0,0,0,.18);
      --radius: 18px;
      --accent:#ffd200; --accentText:#0b0b0b;
      --danger:#d62828; --dangerText:#ffffff;
      --pad: 22px;
      --max: 1880px;

      /* viewport layout */
      --headerH: 56px;
      --gap: 16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 42%, var(--bg3) 100%);
      color: var(--text);
      overflow: hidden; /* ✅ desktop: no scroll */
    }
    a{color:inherit}

    .wrap{
      width:min(var(--max), calc(100vw - (var(--pad)*2)));
      margin:0 auto;
      padding: 14px var(--pad);
      height: 100vh;                 /* ✅ fills screen */
      display:flex;
      flex-direction:column;
      gap: var(--gap);
    }

    header{
      height: var(--headerH);
      display:flex; justify-content:space-between; align-items:center;
      gap:12px;
      flex: 0 0 auto;
    }
    .brand{display:flex; flex-direction:column; gap:2px; min-width:260px}
    .brand strong{font-size:18px; letter-spacing:.2px; text-transform:lowercase;}
    .brand span{font-size:13px; color:var(--muted); text-transform:lowercase;}

    .lang{display:flex; align-items:center; gap:10px}
    .lang label{font-size:12px; color:var(--muted); font-weight:800; text-transform:lowercase;}
    .lang select{
      padding:8px 10px; border-radius:12px; border:1px solid var(--line);
      background: rgba(255,255,255,.85);
      font-weight:800; text-transform:lowercase;
    }

    .hero{
      flex: 1 1 auto;
      min-height: 0;
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap: var(--gap);
      align-items:stretch;
    }
    @media (max-width: 980px){
      body{overflow:auto} /* mobile: allow scroll */
      .wrap{height:auto; min-height:100vh}
      .hero{grid-template-columns:1fr}
    }

    .card{
      background: var(--card);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      min-height:0;
    }
    .inner{
      padding: 16px;
      height:100%;
      display:flex;
      flex-direction:column;
      gap: 10px;
      min-height:0;
    }

    h1{margin:0; font-size:44px; line-height:1.03; text-transform:lowercase; letter-spacing:-.6px}
    .sub{margin:0; color:var(--muted); text-transform:lowercase}

    .trustRow{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
    .pill{
      font-size:12px; color:var(--muted);
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.70);
      text-transform:lowercase;
      white-space:nowrap;
    }

    .priceBox{
      padding: 12px 14px;
      border-radius: 16px;
      border:1px dashed rgba(0,0,0,.18);
      background: rgba(255,255,255,.72);
    }
    .priceTop{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
    .unit{color:var(--muted); text-transform:lowercase; font-weight:700}
