<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>La Vida da Vuelta Shop</title>

<style>
:root{
  --bg1:#86a6b8; --bg2:#b9c9d3; --bg3:#e6e6e6;
  --card:rgba(255,255,255,.92);
  --line:rgba(0,0,0,.08);
  --text:#151515;
  --muted:#555;
  --radius:16px;
  --accent:#ffd200;
  --danger:#d62828;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:linear-gradient(180deg,var(--bg1),var(--bg3));
  color:var(--text);
}
.wrap{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand strong{font-size:18px;text-transform:lowercase}
.brand span{font-size:12px;color:var(--muted);text-transform:lowercase}

.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
@media(max-width:900px){.hero{grid-template-columns:1fr}}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}

h1{margin:0;font-size:38px;text-transform:lowercase}
.sub{margin:4px 0 12px;color:var(--muted);text-transform:lowercase}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:white;
}

.priceBox{
  margin:10px 0;
  padding:10px;
  border:1px dashed var(--line);
  border-radius:12px;
  font-weight:700;
}

.ctaRow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}
.btn{
  height:44px;
  border-radius:12px;
  border:none;
  font-weight:900;
  cursor:pointer;
  text-transform:lowercase;
}
.pay{background:var(--accent)}
.copy{background:#fff;border:1px solid var(--line)}
.wd{background:var(--danger);color:white}

.imgBox img{width:100%;border-radius:14px}

footer{
  margin-top:14px;
  font-size:12px;
  color:var(--muted);
  text-transform:lowercase;
}

/* Modal */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal.show{display:flex}
.modalCard{
  background:white;
  width:90%;
  max-width:700px;
  border-radius:16px;
  padding:18px;
  max-height:80vh;
  overflow:auto;
}
.modalCard h2{margin-top:0}
.close{
  float:right;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="wrap">
<header>
  <div class="brand">
    <strong>la vida da vuelta shop</strong>
    <span id="subtitle">einfach bestellen · weltweit versendet</span>
  </div>
  <select id="lang">
    <option value="de">de</option>
    <option value="en">en</option>
    <option value="es">es</option>
    <option value="fr">fr</option>
    <option value="it">it</option>
  </select>
</header>

<div class="hero">
<div class="card">
<h1>la vida da vuelta</h1>
<p class="sub">por fin se fue</p>

<div class="priceBox">
  <span id="total">26,90 €</span>
</div>

<div class="grid2">
<select id="size">
<option>XS</option><option>S</option><option selected>M</option>
<option>L</option><option>XL</option><option>XXL</option>
</select>

<select id="color"></select>
</div>

<div class="grid2" style="margin-top:10px">
<select id="ship">
<option value="DE">deutschland</option>
<option value="EU">europa</option>
<option value="WW">weltweit</option>
</select>

<input type="number" id="qty" value="1" min="1">
</div>

<div class="ctaRow">
<button class="btn pay" id="buy">bezahlen</button>
<button class="btn wd" id="widerruf">widerruf</button>
<button class="btn copy" id="copy">bestelldaten kopieren</button>
</div>

</div>

<div class="card imgBox">
<img src="shirt-gelb-khaki.png">
</div>
</div>

<footer>
© 2026 · tenzer / torres rivas · konstrukture@gmx.de
</footer>
</div>

<!-- Modal -->
<div class="modal" id="modal">
<div class="modalCard">
<span class="close" onclick="closeModal()">×</span>
<div id="modalContent"></div>
</div>
</div>

<script>
const PRICE=21.95;
const SHIP={DE:4.95,EU:9.95,WW:14.95};
const PAYPAL="https://www.paypal.me/konstrukteure@gmx.de";

const COLORS={
de:["blau","gelb","khaki","grau","weiß","rot","grün"],
en:["blue","yellow","khaki","grey","white","red","green"],
es:["azul","amarillo","caqui","gris","blanco","rojo","verde"],
fr:["bleu","jaune","kaki","gris","blanc","rouge","vert"],
it:["blu","giallo","khaki","grigio","bianco","rosso","verde"]
};

function fillColors(lang){
  const sel=document.getElementById("color");
  sel.innerHTML="";
  COLORS[lang].forEach(c=>{
    const o=document.createElement("option");
    o.textContent=c;
    sel.appendChild(o);
  });
}

function updateTotal(){
  const qty=parseInt(qty.value)||1;
  const s=ship.value;
  const total=(PRICE*qty)+SHIP[s];
  totalEl.textContent=total.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
}

const totalEl=document.getElementById("total");
const qty=document.getElementById("qty");
const ship=document.getElementById("ship");

qty.oninput=updateTotal;
ship.onchange=updateTotal;

document.getElementById("buy").onclick=()=>{
  const qtyVal=parseInt(qty.value)||1;
  const total=(PRICE*qtyVal)+SHIP[ship.value];
  window.open(PAYPAL+"/"+total.toFixed(2),"_blank");
};

document.getElementById("copy").onclick=()=>{
  const txt="order: la vida da vuelta t-shirt";
  navigator.clipboard.writeText(txt);
};

document.getElementById("widerruf").onclick=()=>{
  openModal("<h2>Widerruf</h2><p>Sie haben 14 Tage Widerrufsrecht. Kontakt: konstrukture@gmx.de</p>");
};

function openModal(html){
  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("lang").onchange=e=>{
  fillColors(e.target.value);
};

fillColors("de");
updateTotal();
</script>
</body>
</html>
