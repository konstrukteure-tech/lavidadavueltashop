<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La Vida da Vuelta Shop</title>
  <meta name="description" content="La vida da vuelta – T-Shirt Shop. Einfach bestellen, weltweit versendet." />

  <style>
    :root{
      --bg1:#86a6b8; --bg2:#b9c9d3; --bg3:#e6e6e6;
      --card: rgba(255,255,255,.90);
      --line: rgba(0,0,0,.10);
      --text:#151515;
      --muted:#4a4a4a;
      --shadow: 0 14px 40px rgba(0,0,0,.18);
      --radius: 18px;
      --accent:#ffd200;
      --accentText:#0b0b0b;
      --danger:#d62828;
      --dangerText:#ffffff;
      --pad: 24px;
      --max: 1880px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 42%, var(--bg3) 100%);
      color: var(--text);
      line-height:1.45;
    }
    a{color:inherit}

    .wrap{
      width: min(var(--max), calc(100vw - (var(--pad) * 2)));
      margin: 0 auto;
      padding: 18px var(--pad) 18px;
      min-height: 100vh;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    header{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding: 8px 0 6px;
      flex: 0 0 auto;
    }
    .brand{display:flex; flex-direction:column; gap:2px;}
    .brand strong{font-size:18px; letter-spacing:.2px; text-transform:lowercase;}
    .brand span{font-size:13px; color:var(--muted); text-transform:lowercase;}

    .lang{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
    .lang label{font-size:12px; color:var(--muted); font-weight:800; text-transform:lowercase;}
    .lang select{
      padding:8px 10px; border-radius:12px; border:1px solid var(--line);
      background: rgba(255,255,255,.85);
      font-weight:800; text-transform:lowercase;
    }

    .hero{
      flex: 1 1 auto;
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 18px;
      align-items:stretch;
      min-height: 0;
    }
    @media (max-width: 980px){
      .wrap{padding-bottom:28px}
      .hero{grid-template-columns: 1fr;}
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(4px);
      min-height: 0;
    }
    .inner{
      padding: 16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      height:100%;
    }

    h1{
      margin:0;
      font-size: 44px;
      line-height: 1.03;
      text-transform:lowercase;
      letter-spacing: -0.6px;
    }
    .sub{margin:0; font-size: 16px; color: var(--muted); text-transform:lowercase;}

    .trustRow{display:flex; gap:10px; flex-wrap:wrap; margin-top: 6px;}
    .pill{
      font-size:12px; color: var(--muted);
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.70);
      text-transform:lowercase;
      white-space:nowrap;
    }

    .priceBox{
      display:grid; gap:8px;
      padding: 12px 14px;
      border-radius: 16px;
      border:1px dashed rgba(0,0,0,.18);
      background: rgba(255,255,255,.72);
    }
    .priceTop{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;}
    .unit{font-size: 15px; color: var(--muted); text-transform:lowercase; font-weight: 700;}
    .unit strong{color:var(--text); font-weight: 950;}
    .total{font-size: 28px; font-weight: 950;}
    .breakdown{font-size:12px; color: var(--muted); text-transform:lowercase;}

    .grid2{display:grid; grid-template-columns: 1fr 1fr; gap:12px;}
    @media (max-width: 520px){ .grid2{grid-template-columns:1fr;} }

    label.field{
      display:block; font-size:12px; color: var(--muted);
      margin: 0 0 6px; font-weight: 800; text-transform:lowercase;
    }
    select, input{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.82);
      color: var(--text);
      outline:none;
      font-size: 15px;
      text-transform:lowercase;
    }

    .ctaRow{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
      align-items:stretch;
      margin-top: 2px;
    }
